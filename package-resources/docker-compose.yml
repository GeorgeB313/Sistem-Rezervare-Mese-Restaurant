version: '3.8'
services:
  rezervari:
    build: .
    container_name: rezervari_app
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - RESERVARI_HTTP_PORT=8082
      - RESERVARI_DB_PATH=/app/data/restaurant.db
    ports:
      - "8082:8082"
    # pentru aplicație GUI Swing nu folosește porturi. Dacă rulezi headless, comentează
    # environment:
    #   - DISPLAY=${DISPLAY}
    #   - JAVA_OPTS=-Djava.awt.headless=true
